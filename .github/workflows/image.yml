# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# fd-info 单镜像：查询面 MCP server + CronJob 摄取入口。
# 通道：公开仓直出（本源仓已公开，标准 runner 免费无限）。
name: image

# 2026-11-19 起由本源仓自己出片：仓已公开，标准 runner 免费无限。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata
  IMAGE_NAME: fd-info
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # fd-cn-gov 是 cn-gov 源运行时依赖，从 PyPI 装（不再依赖同级目录快照）
          pip install 'fd-cn-gov>=0.1.3' 
          # server extras 必须装：selfcheck import 上牌入口 fd_info.server
          pip install -e ".[test,server]"

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Surface selfcheck (manifest ↔ runtime)
        run: python scripts/selfcheck_surface.py

  fd-info:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-info
      namespace: finddata
