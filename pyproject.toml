[project]
name = "fd-info"
version = "0.1.0"
description = "寻数·柏讯信息流索引：统一信息条目契约、幂等摄取、游标查询与来源健康度"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "httpx>=0.27",
    # 门 K 线票校验（`line_token.py`）：只有词元轨开启时才走到，但声明在依赖里——
    # 否则镜像缺包，线上表现为 `not_configured`（门静默不挂），而本机能跑。
    "pyjwt[crypto]>=2.8",
]

# MCP 入口单独挂，核心契约与存储只依赖标准库 + httpx（离线可测）。
[project.optional-dependencies]
server = ["fastmcp>=4.2.4,<5"]
test = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
fd-info = "fd_info.cli:main"
fd-info-serve = "fd_info.server:main"

[tool.setuptools.packages.find]
include = ["fd_info*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
